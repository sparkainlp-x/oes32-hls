name: OES-32 HLS testbench (synthesis UNRUN)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ------------------------------------------------------------------
  # Job 1: Compile the C++ testbench with g++ and run all test cases.
  # No Xilinx tools are required for this job.
  # ------------------------------------------------------------------
  testbench:
    name: Build & Run C++ Testbench
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Compile Testbench
        run: |
          g++ -std=c++14 -Wall -Wextra -Wno-unknown-pragmas \
              -o test_oes32_hls \
              test_oes32_hls.cpp oes32_hls_top.cpp

      - name: Run Testbench
        run: ./test_oes32_hls

  # ------------------------------------------------------------------
  # Python example tests (SYNTHETIC): examples/kuramoto_oes32_bridge.py
  # ------------------------------------------------------------------
  python-example:
    name: Python example tests (SYNTHETIC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install numpy pytest
      - name: Run tests
        run: python -m pytest -v tests
      - name: Run example
        run: python examples/kuramoto_oes32_bridge.py

  # ------------------------------------------------------------------
  # Job 2: PLACEHOLDER. Verifies that the HLS source and script files
  # are present and ECHOES the synthesis command. It does NOT run
  # Vitis HLS; a green result means "files present", not "synthesis
  # passed". Evidence tag for synthesis: UNRUN.
  # To enable real synthesis, uncomment the vitis_hls line, move the
  # job to a self-hosted runner with AMD Vitis installed, upload the
  # report as an artifact, and rename this job.
  # ------------------------------------------------------------------
  hls-synthesis:
    name: HLS synthesis (UNRUN — placeholder echo)
    runs-on: ubuntu-latest
    needs: testbench
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Verify HLS Files
        run: |
          echo "Checking OES-32 HLS source and automation scripts..."
          ls -la oes32_hls_top.h oes32_hls_top.cpp run_hls.tcl

      - name: Placeholder - echo synthesis command (UNRUN)
        # To enable full hardware synthesis, use an AMD Vitis environment
        # and uncomment the vitis_hls line below.
        run: |
          echo "TARGET architecture: AMD Xilinx Zynq UltraScale+ RFSoC (ZCU111)"
          echo "Synthesis command (NOT executed): vitis_hls -f run_hls.tcl"
          # vitis_hls -f run_hls.tcl
          echo "Synthesis status: UNRUN (placeholder step; no synthesis was performed)."
