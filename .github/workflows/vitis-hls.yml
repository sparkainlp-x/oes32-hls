name: OES-32 HLS testbench (synthesis UNRUN)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ------------------------------------------------------------------
  # Job 1: Compile the C++ testbench with g++ and run all test cases.
  # No Xilinx tools are required for this job.
  # ------------------------------------------------------------------
  testbench:
    name: Build & Run C++ Testbench
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Compile Testbench
        run: |
          g++ -std=c++14 -Wall -Wextra -Wno-unknown-pragmas \
              -o test_oes32_hls \
              test_oes32_hls.cpp oes32_hls_top.cpp

      - name: Run Testbench
        run: ./test_oes32_hls

  # ------------------------------------------------------------------
  # Streaming triage kernel (oes32_triage_accelerator): g++ testbench vs
  # a double-precision golden model, SYNTHETIC seeded stimuli. `make`
  # fetches the Apache-2.0 ap_int/ap_fixed headers at a pinned commit;
  # hls_stream.h is a testbench-only shim (tb/include_shim). No Xilinx
  # tools; this is NOT synthesis or C/RTL co-simulation.
  # ------------------------------------------------------------------
  triage-testbench:
    name: Triage stream testbench (g++, SYNTHETIC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build & run triage testbench
        run: |
          g++ --version | head -n1
          make test-triage

      - name: Upload tau trace (SYNTHETIC)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-tau-trace-synthetic
          path: build/triage_tau_trace.csv
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Python example tests (SYNTHETIC): examples/kuramoto_oes32_bridge.py
  # ------------------------------------------------------------------
  python-example:
    name: Python example tests (SYNTHETIC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install numpy pytest
      - name: Run tests
        # The extension-based triage tests run in the python-bindings job.
        run: python -m pytest -v tests/test_kuramoto_bridge.py tests/test_triage_reference.py
      - name: Run example
        run: python examples/kuramoto_oes32_bridge.py

  # ------------------------------------------------------------------
  # Python bindings: build the pybind11 extension (real C++ kernel,
  # oes32_triage_stream.cpp unchanged; pinned ap_* headers fetched and
  # SHA-256 verified by CMake) and run the full pytest suite, including
  # Hypothesis property tests (derandomised "ci" profile). C-simulation
  # only; SYNTHETIC stimuli; not synthesis.
  # ------------------------------------------------------------------
  python-bindings:
    name: Python bindings + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build & install extension
        run: python -m pip install -v ".[test]"
      - name: Run pytest (extension required)
        env:
          OES32_REQUIRE_EXT: "1"
          HYPOTHESIS_PROFILE: ci
        run: python -m pytest -v -p no:cacheprovider --hypothesis-show-statistics tests

  # ------------------------------------------------------------------
  # Explainer notebook must execute top to bottom without errors
  # (uses the reference module and the compiled extension).
  # ------------------------------------------------------------------
  notebook:
    name: Notebook execution check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[notebook]"
      - name: Execute notebook
        run: python scripts/check_notebook.py notebooks/oes32_triage_explainer.ipynb

  # ------------------------------------------------------------------
  # Job 2: PLACEHOLDER. Verifies that the HLS source and script files
  # are present and ECHOES the synthesis command. It does NOT run
  # Vitis HLS; a green result means "files present", not "synthesis
  # passed". Evidence tag for synthesis: UNRUN.
  # To enable real synthesis, uncomment the vitis_hls line, move the
  # job to a self-hosted runner with AMD Vitis installed, upload the
  # report as an artifact, and rename this job.
  # ------------------------------------------------------------------
  hls-synthesis:
    name: HLS synthesis (UNRUN — placeholder echo)
    runs-on: ubuntu-latest
    needs: [testbench, triage-testbench]
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Verify HLS Files
        run: |
          echo "Checking OES-32 HLS source and automation scripts..."
          ls -la oes32_hls_top.h oes32_hls_top.cpp run_hls.tcl
          ls -la oes32_triage_stream.h oes32_triage_stream.cpp run_hls_triage.tcl

      - name: Placeholder - echo synthesis command (UNRUN)
        # To enable full hardware synthesis, use an AMD Vitis environment
        # and uncomment the vitis_hls line below.
        run: |
          echo "TARGET architecture: AMD Xilinx Zynq UltraScale+ RFSoC (ZCU111)"
          echo "Synthesis command (NOT executed): vitis_hls -f run_hls.tcl"
          echo "Synthesis command (NOT executed): vitis_hls -f run_hls_triage.tcl"
          # vitis_hls -f run_hls.tcl
          # vitis_hls -f run_hls_triage.tcl
          echo "Synthesis status: UNRUN (placeholder step; no synthesis was performed)."
